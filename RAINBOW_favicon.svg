<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Balanced Rainbow Gradient -->
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="25%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="75%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Sleek Overlay Gradient for Gemini Vibe -->
    <linearGradient id="geminiSheen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Transparent Background -->

  <!-- Outer Neon Glow Layer -->
  <g filter="url(#neonGlow)">
    <!-- Main Outer Arch -->
    <path d="M 120 370 
             C 120 200, 380 200, 380 370 
             L 330 370 
             C 330 240, 170 240, 170 370 Z" 
          fill="url(#rainbowGrad)" 
          stroke="#ffffff" 
          stroke-width="4" 
          stroke-opacity="0.4" />

    <!-- Inner Cutout Arch -->
    <path d="M 190 370 
             C 190 280, 310 280, 310 370 
             L 275 370 
             C 275 305, 225 305, 225 370 Z" 
          fill="#0b0f19" 
          opacity="0.85" />
          
    <!-- Central Core Spark Line -->
    <path d="M 210 370 C 210 325, 290 325, 290 370" 
          fill="none" 
          stroke="url(#geminiSheen)" 
          stroke-width="6" 
          stroke-linecap="round" />
  </g>
</svg>
