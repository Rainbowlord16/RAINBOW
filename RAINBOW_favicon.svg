<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Vibrant full-spectrum rainbow gradient -->
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="20%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="80%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle matching your dark theme -->
  <circle cx="32" cy="32" r="30" fill="#0f172a" stroke="url(#rainbowGrad)" stroke-width="3" />

  <!-- Neural network constellation nodes inside favicon -->
  <g filter="url(#glow)">
    <line x1="32" y1="18" x2="20" y2="42" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="32" y1="18" x2="44" y2="40" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="20" y1="42" x2="44" y2="40" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="32" y1="18" x2="32" y2="32" stroke="#a855f7" stroke-width="2" stroke-opacity="0.8" />

    <!-- Nodes -->
    <circle cx="32" cy="18" r="4" fill="#ef4444" />
    <circle cx="20" cy="42" r="3.5" fill="#3b82f6" />
    <circle cx="44" cy="40" r="3.5" fill="#10b981" />
    <circle cx="32" cy="32" r="5" fill="#a855f7" />
  </g>
</svg>
