             L 330 370 
             C 330 240, 170 240, 170 370 Z" 
          fill="url(#rainbowGrad)" 
          stroke="#ffffff" 
          stroke-width="4" 
          stroke-opacity="0.4" />

    <!-- Inner Cutout Arch (Creating the Modern Gemini-style Ring Loop) -->
    <path d="M 190 370 
             C 190 280, 310 280, 310 370 
             L 275 370 
             C 275 305, 225 305, 225 370 Z" 
          fill="#0b0f19" 
          opacity="0.85" />
          
    <!-- Central Core Spark Line -->
    <path d="M 210 370 C 210 325, 290 325, 290 370" 
          fill="none" 
          stroke="url(#geminiSheen)" 
          stroke-width="6" 
          stroke-linecap="round" />
  </g>
</svg>
