<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <link rel="icon" type="image/svg+xml" href="RAINBOW_favicon.svg" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow AI </title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Marked.js for Markdown parsing & Highlight.js for code syntax highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-base: #0b0f19;
            --sidebar-bg: rgba(15, 23, 42, 0.65);
            --chat-bg: transparent;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --panel-bg: rgba(30, 41, 59, 0.55);
            --bubble-user: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --bubble-ai: rgba(30, 41, 59, 0.75);
            --accent-glow: rgba(168, 85, 247, 0.4);
            --danger: #ef4444;
            --success: #10b981;
        }

        [data-theme="light"] {
            --bg-base: #f1f5f9;
            --sidebar-bg: rgba(255, 255, 255, 0.75);
            --chat-bg: transparent;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(0, 0, 0, 0.08);
            --panel-bg: rgba(255, 255, 255, 0.85);
            --bubble-user: linear-gradient(135deg, #3b82f6, #6366f1);
            --bubble-ai: rgba(241, 245, 249, 0.9);
            --accent-glow: rgba(168, 85, 247, 0.2);
            --danger: #dc2626;
            --success: #059669;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            overflow: hidden;
            color: var(--text-main);
            background: var(--bg-base);
        }

        #neuralCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100vh;
            position: relative;
            z-index: 2;
        }

        .sidebar {
            width: 300px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(25px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
            flex-shrink: 0;
            z-index: 3;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-area {
            font-weight: 600;
            font-size: 18px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .nav-tabs {
            display: flex;
            background: var(--panel-bg);
            border-radius: 10px;
            padding: 4px;
            gap: 4px;
            border: 1px solid var(--border-color);
        }

        .nav-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
        }

        .nav-tab.active {
            background: var(--bubble-user);
            color: #ffffff;
            font-weight: 500;
        }

        .new-chat-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
        }

        .persona-select {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 12px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        .search-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 12px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        .section-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .history-item.active {
            background: rgba(139, 92, 246, 0.15);
            color: var(--text-main);
            border-color: rgba(139, 92, 246, 0.3);
        }

        .main-content {
            flex-grow: 1;
            background: var(--chat-bg);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .panel-header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
        }

        .status-badge {
            font-size: 12px;
            color: var(--success);
            background: rgba(16, 185, 129, 0.15);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .vram-monitor-badge {
            font-size: 11px;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }
        .message-row.user { align-self: flex-end; align-items: flex-end; }
        .message-row.ai { align-self: flex-start; align-items: flex-start; }

        .message-bubble {
            padding: 16px 20px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
        }
        .user .message-bubble {
            background: var(--bubble-user);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            white-space: pre-wrap;
        }
        .ai .message-bubble {
            background: var(--bubble-ai);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .chat-input-area {
            padding: 20px 30px 30px 30px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .input-box-wrapper {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            padding: 12px 16px;
        }

        .input-textarea {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            resize: none;
            height: 28px;
            outline: none;
        }

        .input-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
        }

        .send-action-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="neuralCanvas"></canvas>

    <div class="app-container">
        <div class="sidebar" id="appSidebar">
            <div class="sidebar-header">
                <div class="logo-area">Rainbow AI 🌈</div>
                <button class="theme-btn" onclick="toggleTheme()">☀️</button>
            </div>

            <div class="nav-tabs">
                <button class="nav-tab active">Chat (Gemma)</button>
            </div>

            <button class="new-chat-btn" onclick="startNewChat()">+ New Conversation</button>

            <div class="section-label">AI Persona</div>
            <select class="persona-select" id="personaSelect" onchange="updatePersona()">
                <option value="coder">💻 Rainbow Coder</option>
                <option value="poet">✨ Rainbow Poet</option>
                <option value="general" selected>🌈 Rainbow Balanced</option>
            </select>

            <div class="section-label">Recent History</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="main-content">
            <div class="panel-header">
                <h3 id="activeChatTitle">Local Gemma Node</h3>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <div class="vram-monitor-badge" id="vramMonitor">⚡ WebGPU: Loading...</div>
                    <div id="status" class="status-badge">Syncing Engine...</div>
                </div>
            </div>

            <div class="chat-messages" id="chatbox"></div>

            <div class="chat-input-area">
                <div class="input-box-wrapper">
                    <textarea id="userInput" class="input-textarea" placeholder="Ask local Gemma anything..." disabled></textarea>
                    <div class="input-toolbar">
                        <div></div>
                        <button class="send-action-btn" id="sendBtn" onclick="handleSend()" disabled>Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    function toggleTheme() {
        const html = document.documentElement;
        html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }
</script>

<!-- Web-LLM Local Gemma Engine -->
<script type="module">
    import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

    const statusDiv = document.getElementById('status');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatbox = document.getElementById('chatbox');
    const historyList = document.getElementById('historyList');
    const vramMonitor = document.getElementById('vramMonitor');

    let engine = null;
    let chatSessions = JSON.parse(localStorage.getItem("rainbow_gemma_chats")) || [];
    let currentSessionId = null;
    let currentMessages = [];

    const personas = {
        general: "You are Rainbow, a helpful, playful, and brilliant personal AI assistant built by Herish.",
        coder: "You are Rainbow Coder, an elite expert programmer built by Herish.",
        poet: "You are Rainbow Poet, a creative and imaginative storyteller built by Herish."
    };

    function getSystemPrompt() {
        const select = document.getElementById('personaSelect');
        const val = select ? select.value : 'general';
        return { role: "system", content: personas[val] || personas.general };
    }

    window.updatePersona = function() {
        const sys = getSystemPrompt();
        if (currentMessages.length > 0 && currentMessages[0].role === 'system') {
            currentMessages[0] = sys;
        } else {
            currentMessages.unshift(sys);
        }
    };

    function saveToMemory() {
        let session = chatSessions.find((s) => s.id === currentSessionId);
        if (!session) {
            session = { id: currentSessionId, title: "New Gemma Chat", messages: [] };
            chatSessions.unshift(session);
        }
        session.messages = currentMessages;
        localStorage.setItem("rainbow_gemma_chats", JSON.stringify(chatSessions));
        renderHistoryList();
    }

    function renderHistoryList() {
        historyList.innerHTML = "";
        chatSessions.forEach((session) => {
            const item = document.createElement("div");
            item.className = `history-item ${session.id === currentSessionId ? "active" : ""}`;
            item.innerHTML = `<span>${session.title}</span>`;
            item.addEventListener("click", () => loadChat(session.id));
            historyList.appendChild(item);
        });
    }

    function loadChat(sessionId) {
        currentSessionId = sessionId;
        const session = chatSessions.find((s) => s.id === sessionId);
        currentMessages = session ? [...session.messages] : [];
        chatbox.innerHTML = "";
        currentMessages.filter(m => m.role !== "system").forEach(m => appendMessage(m.role === 'assistant' ? 'ai' : 'user', m.content, false));
        renderHistoryList();
    }

    window.startNewChat = function() {
        currentSessionId = Date.now().toString();
        currentMessages = [getSystemPrompt()];
        chatbox.innerHTML = "";
        appendMessage("ai", "Hello! I am local Gemma 🌈, running entirely on your browser via WebGPU!");
        renderHistoryList();
    }

    function appendMessage(role, text, save = true) {
        const row = document.createElement("div");
        row.className = `message-row ${role}`;
        const bubble = document.createElement("div");
        bubble.className = "message-bubble";
        bubble.innerHTML = marked.parse(text);
        row.appendChild(bubble);
        chatbox.appendChild(row);
        chatbox.scrollTop = chatbox.scrollHeight;

        if (save && role !== 'system') {
            currentMessages.push({ role: role === 'user' ? 'user' : 'assistant', content: text });
            saveToMemory();
        }
        return bubble;
    }

    async function initAI() {
        try {
            engine = await CreateMLCEngine("gemma-2-2b-it-q4f16_1-MLC", {
                initProgressCallback: (p) => { statusDiv.textContent = p.text; },
            });
            statusDiv.textContent = "● Gemma Active";
            vramMonitor.textContent = "⚡ WebGPU: Ready";
            userInput.disabled = false;
            sendBtn.disabled = false;

            if (chatSessions.length > 0) {
                loadChat(chatSessions[0].id);
            } else {
                startNewChat();
            }
        } catch (error) {
            statusDiv.textContent = "Engine Error";
            console.error(error);
        }
    }

    window.handleSend = async function() {
        const text = userInput.value.trim();
        if (!text || !engine) return;

        appendMessage("user", text);
        userInput.value = '';
        sendBtn.disabled = true;

        const aiBubble = appendMessage("ai", "Thinking...", false);

        try {
            const chunks = await engine.chat.completions.create({
                messages: currentMessages,
                stream: true,
            });

            let responseText = "";
            for await (const chunk of chunks) {
                responseText += chunk.choices[0]?.delta?.content || "";
                aiBubble.innerHTML = marked.parse(responseText);
                chatbox.scrollTop = chatbox.scrollHeight;
            }

            currentMessages.push({ role: "assistant", content: responseText });
            saveToMemory();
        } catch (err) {
            aiBubble.textContent = "Execution exception.";
            console.error(err);
        }

        sendBtn.disabled = false;
    }

    userInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });

    initAI();
</script>
</body>
</html>
